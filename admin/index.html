:root{
  --page:#000; --page2:#0b0b0b; --surface:#0f0f0f; --surface2:#161616; --surface3:#1d1d1d;
  --border:#2a2a2a; --border-strong:#454545;
  --text:#f5f5f5; --text2:#c9c9c9; --text3:#9e9e9e; --hi:#f5f5f5;
  --up:#3ddc84; --warn:#f2c14e; --down:#ff7a7a;
  --body:"Manrope","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--text);font:400 16px/1.5 var(--body)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cut{--c:10px;clip-path:polygon(0 0,calc(100% - var(--c)) 0,100% calc(var(--c)*2),100% 100%,0 100%)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ===== каркас ===== */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px;padding:24px 16px;border-right:1px solid var(--border);background:var(--page2)}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none;min-height:40px}
.logo svg{width:26px;height:26px}
.logo b{font-weight:600;font-size:16px;letter-spacing:-.01em}
.logo .wmk{font-size:14px;letter-spacing:.07em}
.logo .wmk span{letter-spacing:0;font-size:13px}
.agree{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;font-size:14px;color:var(--text2);cursor:pointer}
.agree input{width:24px;height:24px;margin:0;accent-color:#f5f5f5}
.agree a{color:var(--text)}
[data-need-agree][aria-disabled="true"]{opacity:.4;pointer-events:none}
.logo span{color:var(--text3);font-weight:400}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;color:var(--text2);text-decoration:none;border:1px solid transparent;font-size:15px}
.nav a:hover{color:var(--text);background:var(--surface)}
.nav a[aria-current="page"]{color:var(--text);background:var(--surface2);border-color:var(--border)}
.nav .sep{height:1px;background:var(--border);margin:10px 8px}
.nav .ext{margin-left:auto;color:var(--text3);width:14px;height:14px}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid var(--border)}
.ava{width:34px;height:34px;display:grid;place-items:center;background:var(--surface3);border:1px solid var(--border-strong);font-weight:600;font-size:14px}
.who .n{font-size:14px;font-weight:600}
.who .t{font-size:13px;color:var(--text3)}
.main{min-width:0;padding:32px 40px 64px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
h1{font:600 32px/1.15 var(--body);letter-spacing:-.025em;margin:0}
h2{font:600 20px/1.25 var(--body);letter-spacing:-.015em;margin:0}
h3{font:600 16px/1.3 var(--body);margin:0}
.muted{color:var(--text3)}
.sub{color:var(--text2);margin:6px 0 0}
.demo{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 12px;border:1px dashed rgba(255,255,255,.4);color:var(--text2);font-size:13px}

/* ===== кнопки, поля ===== */
.btn{--c:8px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border:1px solid transparent;background:none;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;transition:background .2s,border-color .2s,color .2s;white-space:nowrap}
.btn-main{background:var(--hi);color:var(--page)}
.btn-main:hover{background:#d6d6d6}
.btn-ghost{border-color:var(--border-strong);color:var(--text)}
.btn-ghost:hover{border-color:var(--hi);background:rgba(255,255,255,.04)}
.btn-text{padding:0 8px;color:var(--text2);font-weight:500}
.btn-text:hover{color:var(--text)}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:6px;font-size:14px;color:var(--text2)}
.input{min-height:44px;padding:0 12px;background:var(--surface2);border:1px solid var(--border-strong);color:var(--text)}
.input:focus{outline:2px solid var(--hi);outline-offset:0}

/* ===== панели ===== */
.panel{--c:14px;background:var(--surface);border:1px solid var(--border);padding:24px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g-over{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.g-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stack{display:grid;gap:16px;align-content:start}
.kv{display:grid;gap:0}
.kv>div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--border);font-size:15px}
.kv>div:first-child{border-top:0}
.kv>div>span:first-child{color:var(--text2)}
.kv>div>b{font-weight:600}

.status{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap}
.status i{width:7px;height:7px;transform:rotate(45deg);background:currentColor;flex:none}
.s-ok{color:var(--up)} .s-wait{color:var(--warn)} .s-bad{color:var(--down)} .s-off{color:var(--text3)}

/* подписка: главный блок */
.plan-hero{display:grid;gap:24px}
.plan-hero .row{align-self:end}
.plan-hero .row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.plan-name{font:600 44px/1 var(--body);letter-spacing:-.035em}
.plan-name small{font-size:16px;font-weight:500;color:var(--text3);letter-spacing:0;margin-left:8px}
.days b{font:600 44px/1 var(--body);letter-spacing:-.035em}
.days span{color:var(--text3);font-size:15px;margin-left:6px}
.meter{height:8px;background:var(--surface3);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--hi)}
.meter-l{display:flex;justify-content:space-between;font-size:13px;color:var(--text3);margin-top:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap}

.bal{font:600 32px/1 var(--body);letter-spacing:-.025em}
.bal small{font-size:15px;color:var(--text3);font-weight:500;letter-spacing:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0 0;margin-top:16px;border-top:1px solid var(--border);font-size:15px;color:var(--text2)}
.tog{appearance:none;width:44px;height:26px;background:var(--surface3);border:1px solid var(--border-strong);position:relative;cursor:pointer;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:var(--text3);transition:transform .2s var(--ease),background .2s}
.tog:checked{background:var(--hi)}
.tog:checked::after{transform:translateX(18px);background:var(--page)}

.note{display:flex;gap:12px;padding:14px 16px;background:var(--surface2);font-size:14px;color:var(--text2)}
.note .ico{margin-top:2px;color:var(--text3)}

/* ===== тарифы ===== */
.periods{display:inline-flex;border:1px solid var(--border-strong);padding:3px;gap:3px}
.periods button{min-height:36px;padding:0 14px;background:none;border:0;color:var(--text2);cursor:pointer;font-size:14px;font-weight:500}
.periods button[aria-pressed="true"]{background:var(--hi);color:var(--page)}
.periods em{font-style:normal;color:var(--up);margin-left:6px;font-size:13px}
.periods button[aria-pressed="true"] em{color:#0a7a3e}
.plans{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-top:20px}
.pl.cur ul{grid-template-columns:1fr 1fr;gap:10px 20px}
@media (max-width:700px){.pl.cur ul{grid-template-columns:minmax(0,1fr)}}
.pl{--c:14px;background:var(--surface);border:1px solid var(--border);padding:24px;display:flex;flex-direction:column;gap:16px}
.pl.cur{border-color:var(--hi);background:var(--surface2)}
.pl .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pl .nm{font:600 22px/1.1 var(--body);letter-spacing:-.02em}
.tag{font-size:13px;font-weight:600;padding:5px 10px;border:1px solid var(--border-strong);color:var(--text2)}
.pl.cur .tag{background:var(--hi);color:var(--page);border-color:var(--hi)}
.pr{font:600 34px/1 var(--body);letter-spacing:-.03em}
.pr small{font-size:15px;color:var(--text3);font-weight:500;letter-spacing:0}
.pr-l{font-size:13px;color:var(--text3);margin-top:6px;min-height:20px}
.pl ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;flex:1;align-content:start}
.pl li{display:flex;gap:10px;font-size:15px;color:var(--text2)}
.pl li .ico{width:16px;height:16px;margin-top:3px;color:var(--text)}
.pl .btn{width:100%}

/* ===== таблица платежей ===== */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-weight:500;color:var(--text3);font-size:13px;padding:0 12px 10px;border-bottom:1px solid var(--border)}
.tbl td{padding:14px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tbody tr:hover{background:rgba(255,255,255,.02)}
.tx{color:var(--text2);text-decoration:none;border-bottom:1px dashed var(--border-strong)}
.tx:hover{color:var(--text)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border:1px solid var(--border-strong);background:none;color:var(--text2);cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--hi);color:var(--page);border-color:var(--hi);font-weight:600}

/* ===== telegram, безопасность, команда ===== */
.code{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--surface2);border:1px solid var(--border-strong);font:600 20px/1 var(--mono);letter-spacing:.06em}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;color:var(--text2);font-size:15px}
.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--border-strong);color:var(--text);font-weight:600;font-size:14px}
.rule{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--border)}
.rule:first-child{border-top:0;padding-top:0}
.rule .l{display:grid;gap:2px;min-width:0}
.rule .l span{overflow-wrap:anywhere}
.rule,.dev{flex-wrap:wrap;gap:8px 16px}
.rule .l{flex:1 1 170px}
.dev .grow{flex:1 1 170px}
@media (max-width:520px){
  .opt{grid-template-columns:auto minmax(0,1fr)}.opt .fee{grid-column:2;text-align:left}
  .kv>div{flex-direction:column;gap:2px;padding:10px 0}
  .kv>div>b{font-size:15px}
}
@media (max-width:860px){
  .side{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);padding-right:36px}
}
.rule .l span{font-size:14px;color:var(--text3)}
.seat{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.seat:first-child{border-top:0}
.seat .grow{flex:1;min-width:0}
.seat .grow span{display:block;font-size:13px;color:var(--text3)}

/* ===== оформление оплаты (боковая панель) ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--page2);border-left:1px solid var(--border-strong);z-index:41;transform:translateX(100%);visibility:hidden;transition:transform .35s var(--ease),visibility 0s .35s;display:flex;flex-direction:column}
.open .scrim{opacity:1;pointer-events:auto}
.open .drawer{transform:none;visibility:visible;transition:transform .35s var(--ease),visibility 0s}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;border-bottom:1px solid var(--border)}
.db{flex:1;overflow:auto;padding:24px;display:grid;gap:20px;align-content:start}
.df{padding:16px 24px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
@media (max-width:520px){.df .btn{flex:1 1 100%}}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:3px;background:var(--border-strong)}
.prog i.on{background:var(--hi)}
.sum{display:grid;gap:0;padding:4px 16px;background:var(--surface);border:1px solid var(--border)}
.sum>div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--border);font-size:15px}
.sum>div:first-child{border-top:0}
.sum>div>span{color:var(--text2)}
.sum .tot b{font-size:20px}
.opts{display:grid;gap:10px}
.opt{--c:10px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--border);cursor:pointer;text-align:left;width:100%}
.opt:hover{border-color:var(--border-strong)}
.opt[aria-checked="true"]{border-color:var(--hi);background:var(--surface2)}
.opt .rd{width:18px;height:18px;border:1px solid var(--border-strong);display:grid;place-items:center}
.opt[aria-checked="true"] .rd::after{content:"";width:8px;height:8px;background:var(--hi);transform:rotate(45deg)}
.opt .t{font-weight:600;font-size:15px}
.opt .d{font-size:14px;color:var(--text3);margin-top:2px}
.opt .fee{font-size:13px;color:var(--text2);text-align:right}
.nets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.net{min-height:56px;padding:8px 12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;text-align:left;display:grid;gap:2px}
.net b{font-size:15px;font-weight:600}
.net span{font-size:13px;color:var(--text3)}
.net[aria-checked="true"]{border-color:var(--hi);background:var(--surface2)}
.inv{display:grid;grid-template-columns:168px minmax(0,1fr);gap:20px;align-items:start}
.qr{width:168px;height:168px;background:var(--hi);padding:10px;position:relative}
.qr canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.qr span{position:absolute;left:0;right:0;bottom:-24px;text-align:center;font-size:12px;color:var(--text3)}
.copy{display:grid;gap:6px}
.copy .lbl{font-size:13px;color:var(--text3)}
.copy .v{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--border-strong);min-height:44px}
.copy .v code{flex:1;min-width:0;overflow-wrap:anywhere;font:500 14px/1.4 var(--mono)}
.copy .v button{flex:none;width:32px;height:32px;display:grid;place-items:center;background:none;border:1px solid var(--border);cursor:pointer;color:var(--text2)}
.copy .v button:hover{color:var(--text);border-color:var(--hi)}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--border);background:var(--surface)}
.timer b{font:600 22px/1 var(--body);letter-spacing:-.02em}
.track{display:grid;gap:0;list-style:none;margin:0;padding:0}
.track li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;color:var(--text3);font-size:15px;border-top:1px solid var(--border)}
.track li:first-child{border-top:0}
.track li i{width:9px;height:9px;transform:rotate(45deg);border:1px solid var(--border-strong);justify-self:center}
.track li.done{color:var(--text2)} .track li.done i{background:var(--up);border-color:var(--up)}
.track li.now{color:var(--text)} .track li.now i{background:var(--warn);border-color:var(--warn)}
.anim .track li.now i{animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.ok-big{display:grid;gap:12px;justify-items:start;padding:8px 0}
.ok-big .mk{width:56px;height:56px;display:grid;place-items:center;border:1px solid var(--up);color:var(--up)}
.ok-big .mk .ico{width:26px;height:26px;stroke-width:2}

/* ===== вход ===== */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.login .l{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(24px,6vw,96px);gap:28px;max-width:640px}
.login .r{border-left:1px solid var(--border);background:var(--page2);display:flex;align-items:center;justify-content:center;padding:48px;position:relative;overflow:hidden}
.login .r svg.big{width:min(380px,70%);height:auto;color:var(--border-strong)}
.login h1{font-size:44px;letter-spacing:-.035em}
.or{display:flex;align-items:center;gap:12px;color:var(--text3);font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.tgbtn{background:#2aabee;color:#fff;width:100%}
.tgbtn:hover{background:#229ad6}

.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--hi);color:var(--page);padding:12px 18px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s,transform .3s var(--ease);z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== адаптив ===== */
@media (max-width:1100px){.g-over{grid-template-columns:minmax(0,1fr)}.plans{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;gap:8px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .logo b,.logo span,.who,.nav .sep,.nav .ext{display:none}
  .logo{padding:0 4px}
  .nav{display:flex;gap:4px}
  .nav a{white-space:nowrap;padding:0 12px;font-size:14px}
  .nav a .ico{display:none}
  .main{padding:24px 16px 48px}
  h1{font-size:26px}
  .g-2{grid-template-columns:minmax(0,1fr)}
  .login{grid-template-columns:minmax(0,1fr)}.login .r{display:none}
  .tbl .hm{display:none}
  .plan-name,.days b{font-size:36px}
}
@media (max-width:520px){
  .inv{grid-template-columns:minmax(0,1fr)}
  .qr{margin:0 auto 24px}
  .panel{padding:18px}
  .actions .btn{flex:1 1 100%}
  .periods{display:flex}.periods button{flex:1;padding:0 6px}
}
@media (max-width:600px){
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl tr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"d s" "w a";gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--border)}
  .tbl tr:last-child{border-bottom:0}
  .tbl td{padding:0;border:0}
  .tbl .c-d{grid-area:d;color:var(--text3);font-size:13px}
  .tbl .c-s{grid-area:s;justify-self:end}
  .tbl .c-w{grid-area:w}
  .tbl .c-a{grid-area:a;align-self:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== этап 5: регистрация, вход, расширение, возврат ===== */
.auth{display:grid;gap:14px;max-width:420px}
.auth .btn{width:100%}
.gbtn{background:#fff;color:#1f1f1f;border-color:#dadce0}
.gbtn:hover{background:#ececec}
.gbtn svg{width:18px;height:18px}
.tgbtn .ico,.gbtn svg{flex:none}
.auth-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.auth-sw{margin:0;font-size:15px;color:var(--text2)}
.auth-sw a{color:var(--text);font-weight:600;text-underline-offset:3px}
.auth .hint{margin:0;font-size:13px;color:var(--text3)}
.otp{font:600 24px/1 var(--mono);letter-spacing:.35em;text-align:center}
.err{margin:0;color:var(--down);font-size:14px;min-height:20px}
.err:empty{min-height:0}
.lng{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;padding:0 10px;border:1px solid var(--border);color:var(--text2);text-decoration:none;font:600 13px/1 var(--body);letter-spacing:.12em}
.lng:hover{color:var(--text);border-color:var(--border-strong)}
.who{flex-wrap:wrap}
.who .meta{min-width:0;flex:1}
.who .n,.who .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-a{display:flex;gap:6px;width:100%}
.who-a .btn{flex:1;min-height:36px;font-size:13px;padding:0 10px}
.nav button{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;color:var(--text2);background:none;border:1px solid transparent;font-size:15px;cursor:pointer;text-align:left;width:100%}
.nav button:hover{color:var(--text);background:var(--surface)}
.nav .lk{margin-left:auto;width:14px;height:14px;color:var(--text3)}
/* окно Google (демо) */
.gdlg{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.72)}
.gdlg[hidden]{display:none}
.gbox{width:min(420px,100%);background:#fff;color:#1f1f1f;border-radius:10px;padding:24px 0 16px;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.gbox .gh{display:flex;align-items:center;gap:10px;padding:0 24px 14px;font-size:14px;color:#444}

.gacc .gn{display:grid;font-size:14px;min-width:0}

.gform{display:grid;gap:8px;padding:12px 24px 0}

.gx button:hover{background:#f2f6fc}
/* расширение и блокировки */
.locked{display:grid;gap:14px;justify-items:start;padding:28px;border:1px dashed var(--border-strong);background:var(--surface)}
.locked .mk{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--border-strong);color:var(--text2)}

.ext-hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center}

.ext-ico svg{width:34px;height:34px}
@media (max-width:700px){.ext-hero{grid-template-columns:auto minmax(0,1fr)}.ext-hero .btn{grid-column:1/-1;width:100%}}
.calc{display:grid;gap:0}
.calc>div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--border);font-size:15px}
.calc>div:first-child{border-top:0}
.calc>div>span{color:var(--text2)}
.calc .tot b{font-size:22px;color:var(--up)}

@media (max-width:860px){.side .who{display:flex!important;flex:none;flex-wrap:nowrap;margin:0;padding:0;border:0}.who .ava,.who .meta{display:none}.who-a{width:auto}.who-a .btn{min-height:40px}.nav button{white-space:nowrap;padding:0 12px;font-size:14px}.nav button .ico{display:none}.side .lng{flex:none}}


/* ===== админка: дополнения к стилям кабинета ===== */
.nav .grp{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:14px 10px 4px}
.nav a .cnt{margin-left:auto;min-width:22px;padding:2px 6px;background:var(--warn);color:#000;font:700 12px/1.2 var(--body);text-align:center}
.nav a .cnt.r{background:var(--down)}
.side{overflow-y:auto;gap:16px}
.rolebar{display:grid;gap:8px;padding:12px 10px;border-top:1px solid var(--border)}
.rolebar .n{font-size:14px;font-weight:600}
.rolebar .t{font-size:13px;color:var(--text3)}
.role-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 8px;border:1px solid var(--border-strong);color:var(--text2)}
.role-tag.own{border-color:var(--hi);color:var(--hi)}
.lead{font:600 52px/1 var(--body);letter-spacing:-.04em}
.lead small{font-size:16px;font-weight:500;color:var(--text3);letter-spacing:0;margin-left:6px}
.delta{font-size:14px;font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--border);border:1px solid var(--border)}
.kpi{background:var(--surface);padding:16px 18px;display:grid;gap:4px;text-decoration:none}

.chart{position:relative;height:230px;margin-top:18px;padding-left:52px}
.chart .gl{position:absolute;left:52px;right:0;border-top:1px solid var(--border);height:0}
.chart .gl span{position:absolute;right:calc(100% + 8px);top:-9px;font-size:13px;color:var(--text3);white-space:nowrap}
.chart .bars{position:absolute;left:52px;right:0;top:0;bottom:0;display:flex;align-items:flex-end;gap:3px}
.chart .b{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;position:relative;background:none;border:0;padding:0}
.chart .b i{display:block;background:#8a8a8a}
.chart .b i.nw{background:var(--hi)}
.chart .b:hover i,.chart .b.on i{filter:brightness(1.25)}
.chart .b.on::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--text2);pointer-events:none}
.chart .ax{position:absolute;left:52px;right:0;bottom:-24px;display:flex;justify-content:space-between;font-size:13px;color:var(--text3)}
.tip{position:absolute;top:0;z-index:3;min-width:190px;padding:12px 14px;background:var(--surface3);border:1px solid var(--border-strong);font-size:14px;pointer-events:none;display:grid;gap:4px}
.tip b{font-size:15px}
.tip div{display:flex;justify-content:space-between;gap:14px}
.tip span{color:var(--text3)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text2);margin-top:36px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
/* тревоги */
.alerts{display:grid;gap:0}
.al{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--border);text-decoration:none;color:var(--text)}
.al:first-child{border-top:0;padding-top:0}
.al i{width:8px;height:8px;transform:rotate(45deg);background:var(--warn)}
.al.r i{background:var(--down)}.al.g i{background:var(--up)}
.al .t{font-size:15px}.al .t span{display:block;font-size:13px;color:var(--text3)}

/* полоски */
.bar{height:6px;background:var(--surface3);min-width:60px}

.bar.g i{background:var(--up)}.bar.y i{background:var(--warn)}.bar.r i{background:var(--down)}
.hb{display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;font-size:15px}
.hb .bar{height:10px}
.funnel{display:grid;gap:10px}
.funnel .st{display:grid;gap:6px}

  if({gift:1,credit:1,block:1,unblock:1,msg:1}[a]){openM({kind:a,uid:id});return}
  if(a==='device'){openM({kind:'device',uid:b.dataset.uid||id});return}
  if(a==='eye'){toast('Демо: откроется его кабинет только для просмотра, без кнопок оплаты');log('Смотрел кабинет глазами пользователя',id,'');save();return}
  if(a==='reconcile'){log('Запустил сверку','@CryptoBot, OxaPay','Расхождений нет','money');save();toast('Сверка: открытые счета совпадают с провайдерами');rerender();return}
  if(a==='paycredit'){openM({kind:'paycredit',id:b.dataset.id});return}
  if(a==='refok'||a==='refno'||a==='refsent'){openM({kind:a,id:b.dataset.id});return}
  if(a==='release'){openM({kind:'release'});return}
  if(a==='revoke'){var g=DB.SET.go.filter(function(x){return x.v===b.dataset.v})[0];g.revoked=true;log('Отозвал версию GO',g.v,'Старая версия, просим обновиться','settings');save();rerender();toast('Версия '+g.v+' отозвана');return}
  if(a==='scmsg'){var v=$('[data-scmsg]').value.trim();if(!v){toast('Напишите текст');return}DB.SET.scmsg=v;log('Сообщение в сканере','Все',v,'settings');save();rerender();toast('Сообщение показано в сканере');return}
  if(a==='scmsgoff'){DB.SET.scmsg='';log('Убрал сообщение в сканере','Все','','settings');save();rerender();return}
  if(a==='prices'){var np={};var bad=false;['d','w','m'].forEach(function(p){var v=parseFloat(String($('[data-price="'+p+'"]').value).replace(',','.'));if(!(v>0))bad=true;np[p]=r2(v)});if(bad){toast('Цена должна быть больше нуля');return}var S=DB.SET.prices;if(np.d===S.d&&np.w===S.w&&np.m===S.m){toast('Цены не изменились');return}openM({kind:'prices',np:np});return}
  if(a==='promo'){openM({kind:'promo'});return}
  if(a==='mprev'){var tx=$('[data-mtxt]').value.trim(),sg=$('[data-mseg]').value;if(!tx){toast('Напишите текст рассылки');return}if(!segN(sg)){toast('В этом сегменте никого нет');return}openM({kind:'mail',seg:sg,txt:tx});return}
  if(a==='tkdone'){var tk=DB.TK.filter(function(i){return i.id===M.id})[0];tk.st='done';log('Закрыл обращение',tk.id+' · '+tk.u,'');save();closeM();rerender();toast('Обращение решено');return}
  if(a==='publish'){log('Отправил контент на публикацию','Сайт','Полоса: '+(DB.SET.banner.on?'«'+DB.SET.banner.text+'»':'выкл')+', валуйные: '+DB.SET.value,'settings');save();toast('Демо: изменения пройдут проверку и появятся на превью');rerender();return}
  if(a==='faqadd'){openM({kind:'faq',i:null});return}
  if(a==='faqed'){openM({kind:'faq',i:+b.dataset.i});return}
  if(a==='faqdel'){var f=DB.SET.faq.splice(M.i,1)[0];log('Удалил вопрос','FAQ',f[0],'settings');save();closeM();rerender();return}
  if(a==='faqup'||a==='faqdn'){var i=+b.dataset.i,j=a==='faqup'?i-1:i+1,F2=DB.SET.faq,tmp=F2[i];F2[i]=F2[j];F2[j]=tmp;save();rerender();return}
  if(a==='invite'){openM({kind:'invite'});return}
  if(a==='kill'){b.closest('.dev').remove();log('Завершил сессию','iPhone · Safari','','settings');save();toast('Сессия завершена');return}
});
D.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.bk){if(SE.role!=='owner'){t.checked=!t.checked;return}var bk=DB.BK.filter(function(x){return x.n===t.dataset.bk})[0];bk.on=t.checked;if(bk.on&&bk.st==='off')bk.st='ok';log(t.checked?'Включил букмекера':'Выключил букмекера',bk.n,'','settings');save();rerender();toast(bk.n+(t.checked?' снова в ленте':' убран из ленты у всех'));return}
  if(t.dataset.promo){var p=DB.SET.promos.filter(function(x){return x.code===t.dataset.promo})[0];p.on=t.checked;log(t.checked?'Включил промокод':'Выключил промокод',p.code,'','settings');save();toast(p.code+(t.checked?' работает':' выключен'));return}
  if(t.dataset.set){var path=t.dataset.set.split('.'),o=DB.SET;for(var i=0;i<path.length-1;i++)o=o[path[i]];var v=t.type==='checkbox'?t.checked:(/^\d+$/.test(t.value)?+t.value:t.value);o[path[path.length-1]]=v;log('Изменил настройку',t.dataset.set,String(v),'settings');save();toast('Сохранено');return}
  if(t.dataset.days&&M)M.days=t.value;
});
D.addEventListener('input',function(e){
  var t=e.target,k=t.hasAttribute('data-uq')?'uq':t.hasAttribute('data-pq')?'pq':t.hasAttribute('data-lq')?'lq':null;
  if(k){F[k]=t.value;var pos=t.selectionStart;rerender();var n=$('[data-'+k+']');if(n){n.focus();n.setSelectionRange(pos,pos)}}
});
D.addEventListener('keydown',function(e){if(e.key==='Escape'&&M)closeM();if(e.key==='Enter'&&e.target.matches('[data-otp]'))$('[data-act="otp"]').click();if(e.key==='Enter'&&e.target.matches('[data-amail]'))$('[data-act="authmail"]').click()});
var tt;function toast(m){var t=$('.toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2600)}
route();
})();
